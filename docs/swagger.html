<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dendro Age Swagger</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>

        dom_id: "#swagger-ui",
        persistAuthorization: true
    });
</script>
</body>
</html>
