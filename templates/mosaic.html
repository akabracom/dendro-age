<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аномальные паттерны</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="phone">
    <main class="mosaic">
        <h1 class="page-title">Аномальные паттерны</h1>
        <form class="filter" method="get" action="/dendro_scale_patterns">
            <div class="filter__pill filter__pill--dates">
                <span class="filter__caption">С</span>
                <input class="filter__date" type="date" name="date_from" value="{{ .DateFrom }}">
                <span class="filter__caption">по</span>
                <input class="filter__date" type="date" name="date_to" value="{{ .DateTo }}">
                <button class="filter__submit" type="submit">Найти</button>
            </div>
        </form>
        <section class="mosaic__grid">
            {{ range .DendroScalePatterns }}
            <article class="card-wrap">
                <a class="card" href="/dendro_scale_patterns/feed/{{ .ID }}">
                    <img class="card__image" src="{{ .ImageSrc }}" alt="{{ .Title }}">
                    <div class="card__shade">
                        <h2 class="card__title">{{ .Title }}</h2>
                        <p class="card__meta"><span class="card__heart"></span> {{ .LikeCount }} · {{ .EventYear }}</p>
                    </div>
                </a>
                <form class="card-delete" method="post" action="/dendro_scale_patterns/{{ .ID }}/remove">
                    <button class="card-delete__btn" type="submit">Удалить</button>
                </form>
            </article>
            {{ else }}
            <p class="mosaic__empty">Нет паттернов за выбранные даты.</p>
            {{ end }}
        </section>
    </main>
    {{ template "tabbar" . }}
</div>
</body>
</html>
