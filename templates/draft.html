<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Черновик паттерна</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="phone">
    <main class="draft">
        <h1 class="page-title">Черновик паттерна</h1>
        <p class="page-sub">Заполните данные без сохранения</p>
        <form class="draft__form" action="/dendro_scale_patterns/draft" method="get">
            <label class="media-block media-block--video">
                <span class="media-block__caption">Видео паттерна</span>
                <input class="media-block__input" type="file" name="video" accept="video/*" lang="en">
            </label>
            <label class="media-block media-block--image" style="background-image: url('{{ .DendroScalePattern.ImageURL }}')">
                <span class="media-block__caption media-block__caption--on-photo">Изображение</span>
                <input class="media-block__input media-block__input--on-photo" type="file" name="image" accept="image/*" lang="en">
            </label>
            <div class="fields-card">
                <label class="fields-card__label">Название
                    <input class="fields-card__input" type="text" name="title" value="{{ .DendroScalePattern.Title }}">
                </label>
                <div class="fields-card__row">
                    <label class="fields-card__label">Год начала
                        <input class="fields-card__input" type="number" name="event_year" value="{{ .DendroScalePattern.EventYear }}">
                    </label>
                    <label class="fields-card__label">Количество колец
                        <input class="fields-card__input" type="number" name="ring_count" value="{{ .DendroScalePattern.RingCount }}">
                    </label>
                </div>
                <label class="fields-card__label">Краткое описание
                    <textarea class="fields-card__input" name="short_description" rows="2">{{ .DendroScalePattern.ShortDescription }}</textarea>
                </label>
                <label class="fields-card__label">Описание
                    <textarea class="fields-card__input" name="full_description" rows="4">{{ .DendroScalePattern.FullDescription }}</textarea>
                </label>
            </div>
        </form>
    </main>
    {{ template "tabbar" . }}
</div>
</body>
</html>
